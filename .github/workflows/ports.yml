name: Port validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: centrexity/GamePKG
          # Pin the host that admits the original-Xbox/local-upscaling source recipe.
          ref: 20c8386391f3d5e7d8a0634e95e9920fa9593b34
          path: host
      - uses: actions/checkout@v4
        with:
          path: host/ports
      - uses: dtolnay/rust-toolchain@stable
      - name: Install original SDL reference test dependencies
        working-directory: host
        run: bash tools/ci_ubuntu_apt.sh update && bash tools/ci_ubuntu_apt.sh install -y libsdl2-dev g++
      - name: Check port gameplay, signing, policy, and lock hashes
        working-directory: host
        run: cargo test --locked --test game_2048 --test game_arkanoo --test zelda3_policy --test doom_policy --test cube2_policy --test examples
      - name: Check import catalog and release metadata
        working-directory: host/ports
        run: python3 tools/check_catalog.py
      - name: Check reviewed native profile and source-kit rejection cases
        working-directory: host
        run: cargo test --locked --lib takedawn
      - name: Verify the actual native source archive and signed package
        working-directory: host
        env:
          GAMEPKG_TAKEDAWN_KIT_SHA256: 400f7cf7986b4f59658f4d8f78f54dc9065385a0a532c7d1e286ce7a624b0a12
        run: |
          set -euo pipefail
          export GAMEPKG_TAKEDAWN_KIT="$PWD/ports/takedawn/assets/takedawn-source-kit.tar.gz"
          cargo test --locked --lib takedawn_kit::tests::prepared_sdk_archive -- --ignored --exact
          fixture_work=$(mktemp -d)
          chmod 700 "$fixture_work"
          cargo run --locked --bin gamepkg -- keygen --output "$fixture_work/creator.key"
          cargo run --locked --bin gamepkg -- pack ports/takedawn --output "$fixture_work/takedawn.gamepkg" --key "$fixture_work/creator.key"
          cargo run --locked --bin gamepkg -- verify "$fixture_work/takedawn.gamepkg"
      - name: Check fullscreen shortcuts and real renderer settings
        working-directory: host
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined $(pkg-config --cflags sdl2) -Iengines/takedawn/media-bridge engines/takedawn/media-bridge/tests/fullscreen_hotkey.c -o "$RUNNER_TEMP/fullscreen-shortcut-test"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/fullscreen-shortcut-test"
          fixture_kit=$(mktemp -d)
          tar -xzf ports/takedawn/assets/takedawn-source-kit.tar.gz -C "$fixture_kit"
          python3 tools/check_takedawn_presentation_defaults.py --toolkit "$fixture_kit/toolkit" --cc cc --sanitize
          python3 tools/check_takedawn_ui_scaling.py --toolkit "$fixture_kit/toolkit" --cc cc
          python3 tools/check_takedawn_input_glyphs.py --cc cc
