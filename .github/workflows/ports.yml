name: Port validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: centrexity/GamePKG
          ref: v0.1.15
          path: host
      - uses: actions/checkout@v4
        with:
          path: host/ports
      - uses: dtolnay/rust-toolchain@stable
      # v0.1.15 predates reviewed external engines. Hold that recipe so its
      # manifest is not parsed as a Cube 2 package. Hosts that declare
      # external_engine keep it.
      - name: Hold external-engine recipes on hosts that predate them
        working-directory: host
        run: |
          if ! grep -q 'external_engine' src/lib.rs; then
            mv ports/halo /tmp/halo-recipe
            echo HELD_OPENCE=1 >> "$GITHUB_ENV"
          fi
      - name: Check port gameplay, signing, policy, and lock hashes
        working-directory: host
        run: cargo test --locked --test game_2048 --test game_arkanoo --test zelda3_policy --test doom_policy --test cube2_policy --test examples
      - name: Restore the OpenCE recipe
        if: env.HELD_OPENCE == '1'
        run: mv /tmp/halo-recipe host/ports/halo
      - name: Check import catalog and release metadata
        working-directory: host/ports
        run: python3 tools/check_catalog.py
      - name: Check the OpenCE selector
        working-directory: host/ports
        run: python3 tools/test_opence_checkout.py
